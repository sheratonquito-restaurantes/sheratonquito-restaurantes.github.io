<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel del catálogo · Sheraton Quito</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=4">
</head>
<body>
  <!-- Acceso: inicio de sesión o configuración inicial -->
  <section id="pantalla-acceso" class="acceso">
    <div class="acceso-caja">
      <img src="../assets/logos/sheraton-negro.png" alt="Sheraton Quito Hotel" class="acceso-logo">
      <p class="sobretitulo">Restaurantes y Bares</p>
      <h1>Panel del catálogo</h1>
      <div id="acceso-contenido"><p class="cargando">Cargando…</p></div>
      <p class="acceso-pie">Acceso solo para personal autorizado del hotel.</p>
    </div>
  </section>

  <!-- Editor -->
  <div id="app" hidden>
    <header class="cabecera">
      <img src="../assets/logos/sheraton-blanco.png" alt="Sheraton Quito" class="cabecera-logo">
      <div class="cabecera-titulo"><b>Panel del catálogo</b><span id="usuario-actual"></span></div>
      <label class="selector-temporada">Editando
        <select id="temporada-editando" aria-label="Temporada que se está editando"></select>
      </label>
      <span id="estado-temporada" class="chip"></span>
      <div class="cabecera-acciones">
        <button class="btn btn-claro" data-accion="vista-previa">👁 Vista previa</button>
        <button class="btn btn-dorado" data-accion="publicar" id="boton-publicar">🚀 Publicar</button>
        <button class="btn btn-claro" data-accion="salir">Salir</button>
      </div>
    </header>
    <nav class="pestanas" id="pestanas">
      <button data-pestana="temporadas">📚 Temporadas</button>
      <button data-pestana="paginas">🖼️ Secciones y páginas</button>
      <button data-pestana="textos">✍️ Textos de la temporada</button>
      <button data-pestana="general">🍽️ Menús, contacto y datos</button>
      <button data-pestana="usuarios">🔐 Usuarios y acceso</button>
    </nav>
    <main id="contenido" class="contenido"></main>
  </div>

  <dialog id="dialogo" class="dialogo"><form method="dialog" id="dialogo-form"></form></dialog>
  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <script src="admin.js?v=4"></script>
</body>
</html>
